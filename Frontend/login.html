<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrac</title>
    <link rel="stylesheet" href="loginstyle.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>
<body>
    <div class="backtxt">
        <h1>Welcome to FinTrac</h1>
    </div>
    <div class="wrapper">
        <form id="login-form" action="">
            <h1>Log In</h1>
            <div class="button-box">
                <button id="google-login" type="button">Continue with Google</button>
                <i class='bx bxl-google' ></i>
            </div>
            <div class="input-box">
                <input id="login-username" type="text" placeholder="username" required>
                 <i class='bx bxs-user'></i>
            </div>
            <div class="input-box">
                <input id="login-password" type="password" placeholder="password" required>
                <i class='bx bxs-lock' ></i>
            </div>
            <div class="input-box">
                <button type="submit" class="btn">Sign In</button>
            </div>
            <div class="register-link">
                <p>Don't have an account, <a id="signup-link" href="#">SignUp</a></p>
            </div>
            <p id="login-status" aria-live="polite" style="margin-top:10px;text-align:center;"></p>
            
            
        </form>
    </div>
	<script src="frontend-tests.js"></script>
	<script src="integration-tests.js"></script>
	<script src="script.js"></script>
</body>
</html>
